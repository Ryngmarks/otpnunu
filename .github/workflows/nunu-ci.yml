# otpnunu – tester vid varje push till nunu/dev.
# Enhetstester, servern med låtsas-Riot och synken mot en riktig PostgreSQL.
# Inget driftsätts härifrån – appen körs lokalt (npm start).
name: otpnunu – tester

on:
  push:
    branches: [nunu/dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tester (med PostgreSQL)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm test
